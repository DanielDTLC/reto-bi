# Opción rápida: levanta PostgreSQL con los datos del Reto ETL y la aplicación.
#   docker compose up --build      ->  http://localhost:8000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reto_etl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
    volumes:
      - ./database/datos.sql:/docker-entrypoint-initdb.d/01_datos.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reto_etl"]
      interval: 3s
      retries: 20
  app:
    build: .
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: reto_etl
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
